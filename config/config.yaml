# Workspace configuration read by simws.config and the Snakemake workflow.
# ~ and $VARS are expanded. Nothing else in the codebase should hardcode these paths.
envs_root: ~/miniforge3/envs
results_dir: results
toolchain:
  charon_exe: ~/tcad/build/src/charon_mp.exe
  tcad_install_lib: ~/tcad/install/lib
  dakota: ~/tcad/dakota-6.24.0-public-rhel8.Linux.x86_64-cli/bin/dakota
  openvaf: tools/openvaf-r.wrapper.sh
data:
  pseudopotentials: sim_data/pseudopotentials
  charon_particle_strike_gold: 03_tcad_devices/particle_strike_ref/gold_currents.csv
threads:
  default: 2
  mpi_ranks: 4

# --- single-event studies (simws 0.4)
seu_qcrit_fC: 2.0            # critical charge of the struck node; default = C_node x V_DD (2 fF x 1 V)
ser_spectrum: ""             # path to an environment LET spectrum (CREME96 / OMERE output); empty = no rate
ser_let_unit: "MeV cm2/mg"   # CREME96 LET tables are usually MeV cm2/g: check the file header
ser_flux_unit: "1/cm2/s/sr"  # e.g. "1/m2/s/sr" for CREME96
event_ions: "17:35:300,36:84:1000"   # Z:A:E_MeV for the Geant4 event study
event_count: 20              # Geant4 events per ion
event_seu_count: 12          # events per ion that each get a DEVSIM run

# --- first-principles parameters (simws 0.7): rule dft_params (in `studies`)
dft:
  pseudo_set: pseudodojo  # bundled = the 0.7 set in simws/dft/pseudo; pseudodojo = sim_data/pseudopotentials/pseudodojo_v0.4
  env: materials             # conda env with pw.x (Quantum ESPRESSO); CHGNet benchmark runs if chgnet imports there
  pseudo_dir: ""             # empty = the validated set shipped in simws/dft/pseudo; else a directory plus:
  pseudos: {}                #   Si_pbe, Si_pbe_fr (fully relativistic, for spin-orbit), Si_lda
  ecutwfc: 40.0
  hse_kgrids: [[4, 4, 4]]    # add [6, 6, 6] for the hybrid-gap convergence check (about 20x slower)

# --- simws 0.8 hub: content-addressed store + knowledge graph. Default: <workspace>/store (git-ignored; every
# result can be regenerated from its job key). Override with an absolute path here or SIMWS_STORE.
# hub:
#   store: /home/<you>/sim_workspace/store
