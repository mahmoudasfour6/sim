# Interface properties as distributions, not single numbers: the literature spread is the honest input until a
# measured value for your process replaces it (status: provisional for every entry). Distributions:
#   loguniform {low, high}   uniform in log10 between the bounds (order-of-magnitude knowledge)
#   normal     {mean, sigma}
#   uniform    {low, high}
# Sampled by simws.materials.laws.sample_interface(name, key, n, seed).
version: 1
interfaces:
  Si/SiO2:
    Dit_midgap:
      distribution: loguniform
      low: 1.0e9
      high: 1.0e11
      unit: 1/cm**2/eV
      ref: "thermal oxide after forming-gas anneal ~1e10; unannealed or irradiated up to ~1e11+. Typical-range statement (Sze & Ng 2007, ch. 4; Fleetwood, IEEE TNS 60, 1706 (2013)); process dependent"
      status: provisional
    Qf:
      distribution: loguniform
      low: 1.0e10
      high: 1.0e11
      unit: 1/cm**2
      ref: "fixed oxide charge, (100) thermal oxide, typical range (Sze & Ng 2007, ch. 4); process dependent"
      status: provisional
  4H-SiC/SiO2:
    Dit_near_Ec:
      distribution: loguniform
      low: 1.0e11
      high: 1.0e13
      unit: 1/cm**2/eV
      ref: "near-conduction-band interface states; ~1e13 as-oxidised, ~1e11-1e12 after NO/N2O anneal. Range statement, check against your process (reviews: Kimoto & Cooper, Fundamentals of SiC Technology, Wiley 2014, ch. 6)"
      status: provisional
  Ni/4H-SiC:
    phi_B_n:
      distribution: uniform
      low: 1.3
      high: 1.7
      unit: eV
      ref: "Schottky barrier height of Ni on n-type 4H-SiC (Si face), I-V/C-V spread across reports; inhomogeneous barriers (Kimoto & Cooper 2014, ch. 7)"
      status: provisional
