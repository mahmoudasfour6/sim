[pytest]
testpaths = tests
# Fast tier by default; the slow tier re-runs real solvers: pytest -m slow
# tests/unit, tests/connections and tests/v1 need the tcad env (DEVSIM); tools/nightly.sh and the installer run them
# there with:  $E/tcad/bin/python -m pytest -o addopts= -m "not slow" tests/unit tests/connections tests/v1
addopts = -m "not slow" --ignore=tests/unit --ignore=tests/connections --ignore=tests/v1
markers =
    slow: re-runs a real solver in its conda env (minutes)
